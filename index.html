<head>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2>登录</h2>
            <p class="modal-sub">输入你的游戏账号名称</p>

    <script src="data.js"></script>
    <script src="script.js"></script>

    <script>
        var APP_VERSION = '2026.08.30.001';
        var CACHE_MAX_AGE = 5 * 60 * 1000;

        function loadVersion() {
            fetch('version.txt?' + Date.now())
                .then(function(response) {
                    if (!response.ok) throw new Error('version.txt 不存在');
                    return response.text();
                })
                .then(function(text) {
                    var match = text.match(/version:"([^"]+)"/);
                    if (match && match[1]) {
                        APP_VERSION = match[1].trim();
                        console.log('[刺玫会 Wiki] 版本号已加载:', APP_VERSION);
                    } else {
                        console.warn('[刺玫会 Wiki] version.txt 格式错误，使用默认版本号');
                    }
                    checkVersionAndClearCache();
                })
                .catch(function() {
                    console.warn('[刺玫会 Wiki] version.txt 未找到，使用默认版本号:', APP_VERSION);
                    checkVersionAndClearCache();
                });
        }

        function checkVersionAndClearCache() {
            var storedVersion = localStorage.getItem('app_version');
            if (storedVersion !== APP_VERSION) {
                sessionStorage.clear();
                localStorage.setItem('app_version', APP_VERSION);
                console.log('[刺玫会 Wiki] 版本已更新 (', storedVersion, '->', APP_VERSION, ')，缓存已清除');
            } else {
                console.log('[刺玫会 Wiki] 版本一致，无需清除缓存');
            }
        }

        var giscusLoaded = false;

        function loadGiscus(pageId) {
            var container = document.getElementById('giscus-container');
            if (!container) return;

            container.innerHTML = '';

            var wrapper = document.createElement('div');
            wrapper.className = 'giscus';
            container.appendChild(wrapper);

            // 确定唯一的 term：优先使用传入的 pageId，否则从 URL hash 提取
            var term = pageId;
            if (!term || term === '' || term === '/wiki/') {
                var hash = window.location.hash;
                if (hash && hash.startsWith('#page-')) {
                    term = hash.replace('#page-', '');
                } else {
                    term = window.location.pathname + window.location.hash;
                }
            }

            if (!giscusLoaded) {
                var script = document.createElement('script');
                script.src = 'https://giscus.app/client.js';
                script.setAttribute('data-repo', 'SoServer/wiki');
                script.setAttribute('data-repo-id', 'R_kgDOUIrQLw');
                script.setAttribute('data-category', 'General');
                script.setAttribute('data-category-id', 'DIC_kwDOUIrQL84DE3pT');
                script.setAttribute('data-mapping', 'specific');
                script.setAttribute('data-term', term);
                script.setAttribute('data-strict', '0');
                script.setAttribute('data-reactions-enabled', '1');
                script.setAttribute('data-emit-metadata', '0');
                script.setAttribute('data-input-position', 'top');
                script.setAttribute('data-theme', 'preferred_color_scheme');
                script.setAttribute('data-lang', 'zh-CN');
                script.setAttribute('crossorigin', 'anonymous');
                script.async = true;
                document.body.appendChild(script);
                giscusLoaded = true;
            } else {
                var oldScript = document.querySelector('script[src="https://giscus.app/client.js"]');
                if (oldScript) {
                    var newScript = document.createElement('script');
                    newScript.src = 'https://giscus.app/client.js';
                    for (var i = 0; i < oldScript.attributes.length; i++) {
                        var attr = oldScript.attributes[i];
                        // 更新 data-term 为新的 pageId
                        if (attr.name === 'data-term') {
                            newScript.setAttribute('data-term', term);
                        } else {
                            newScript.setAttribute(attr.name, attr.value);
                        }
                    }
                    newScript.async = true;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                }
            }
        }

        function render404(pageId, pageContent) {
            var errorHtml = '<div class="doc-content">';
            errorHtml += '<h1 style="border-left-color:#c0392b;">页面不存在</h1>';
            errorHtml += '<p style="color:var(--text-secondary);font-size:1.1rem;">抱歉，无法加载您请求的页面。</p>';
            errorHtml += '<div style="background:rgba(192,57,43,0.06);border-left:4px solid #c0392b;padding:1.2rem 1.5rem;border-radius:0 var(--radius) var(--radius) 0;margin:1.2rem 0;">';
            errorHtml += '<p style="color:var(--text-primary);font-weight:700;margin-bottom:0.4rem;">可能的原因</p>';
            errorHtml += '<ul style="margin:0;padding-left:1.2rem;color:var(--text-secondary);">';
            errorHtml += '<li><strong>内容不存在：</strong>页面 <code style="background:rgba(0,0,0,0.06);padding:0.1rem 0.4rem;border-radius:4px;font-family:\'Courier New\',monospace;color:#c0392b;">' + pageId + '</code> 不在 <code>pages/</code> 目录中，或 <code>data.js</code> 未正确映射。</li>';
            errorHtml += '<li><strong>服务端拒绝访问：</strong>该页面链接的服务端 API 拒绝了访问请求。</li>';
            errorHtml += '<li><strong>网络状态异常：</strong>您的网络连接异常，导致未能正确访问该页面。</li>';
            errorHtml += '</ul></div>';
            errorHtml += '<div style="display:flex;flex-wrap:wrap;gap:0.8rem;margin:1.2rem 0;">';
            errorHtml += '<a href="/wiki/" style="padding:0.5rem 1.2rem;border-radius:40px;background:var(--accent);color:#fff;font-family:var(--font-pixel);font-size:0.9rem;transition:all var(--transition);display:inline-block;">返回首页</a>';
            errorHtml += '<a href="https://github.com/SoServer/SoServer.github.io" target="_blank" style="padding:0.5rem 1.2rem;border-radius:40px;border:1px solid var(--border-color);color:var(--text-secondary);font-family:var(--font-pixel);font-size:0.9rem;transition:all var(--transition);display:inline-block;">反馈问题</a>';
            errorHtml += '</div>';
            errorHtml += '<div style="background:rgba(0,0,0,0.02);border-radius:var(--radius);padding:0.8rem 1.2rem;border:1px solid var(--border-color);">';
            errorHtml += '<p style="color:var(--text-muted);font-size:0.85rem;">提示：检查 <code style="background:rgba(0,0,0,0.06);padding:0.1rem 0.4rem;border-radius:4px;font-family:\'Courier New\',monospace;color:#4a4a4a;">data.js</code> 中的 <code style="background:rgba(0,0,0,0.06);padding:0.1rem 0.4rem;border-radius:4px;font-family:\'Courier New\',monospace;color:#c0392b;">pagePathMap</code> 是否正确配置了 <code style="background:rgba(0,0,0,0.06);padding:0.1rem 0.4rem;border-radius:4px;font-family:\'Courier New\',monospace;color:#c0392b;">' + pageId + '</code> 的映射。</p>';
            errorHtml += '</div>';
            errorHtml += '<div class="footnote"><p>刺玫会 · 404 页面未找到</p></div>';
            errorHtml += '</div>';
            pageContent.innerHTML = errorHtml;
            if (typeof updateActiveState === 'function') {
                updateActiveState(pageId);
            }
            if (window.location.hash !== '#page-' + pageId) {
                history.pushState(null, '', '#page-' + pageId);
            }
        }

        function getDisplayName(key) {
            return displayNames[key] || key;
        }

        function renderCards() {
            var grid = document.getElementById('cardGrid');
            var html = '';
            for (var i = 0; i < cardData.length; i++) {
                var cat = cardData[i];
                var itemsHtml = '';
                for (var j = 0; j < cat.items.length; j++) {
                    var key = cat.items[j];
                    itemsHtml += '<li data-page="' + key + '" data-selected="false">' +
                        '<i class="fas fa-file-alt"></i> ' + getDisplayName(key) +
                        '</li>';
                }
                html += '<div class="card"><div class="card-title"><i class="fas ' + cat.icon + '"></i> ' + cat.title + '</div><ul class="card-list">' + itemsHtml + '</ul></div>';
            }
            grid.innerHTML = html;
        }

        function initCards() {
            var grid = document.getElementById('cardGrid');
            if (!grid) return;
            grid.addEventListener('click', function(e) {
                var target = e.target.closest('.card-list li');
                if (!target || !target.dataset.page) return;
                var isMobile = window.innerWidth < 769;
                if (isMobile) {
                    var isSelected = target.dataset.selected === 'true';
                    document.querySelectorAll('.card-list li').forEach(function(li) {
                        li.dataset.selected = 'false';
                        li.classList.remove('selected');
                    });
                    if (isSelected) {
                        loadPage(target.dataset.page);
                    } else {
                        target.dataset.selected = 'true';
                        target.classList.add('selected');
                    }
                } else {
                    loadPage(target.dataset.page);
                }
            });
        }

        function isCacheValid(cacheKey) {
            var cached = sessionStorage.getItem(cacheKey);
            var timeKey = cacheKey + '_time';
            var cacheTime = sessionStorage.getItem(timeKey);
            if (!cached || !cacheTime) return false;
            var now = Date.now();
            return (now - parseInt(cacheTime)) < CACHE_MAX_AGE;
        }

        function reExecuteScripts(container) {
            var scripts = container.querySelectorAll('script');
            scripts.forEach(function(oldScript) {
                var newScript = document.createElement('script');
                for (var i = 0; i < oldScript.attributes.length; i++) {
                    var attr = oldScript.attributes[i];
                    newScript.setAttribute(attr.name, attr.value);
                }
                if (oldScript.textContent) {
                    newScript.textContent = oldScript.textContent;
                }
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }

        var isLoading = false;

        function loadPage(pageId) {
            if (isLoading) {
                console.log('[刺玫会 Wiki] 正在加载中，请稍候...');
                return;
            }

            var anchor = '';
            if (pageId.includes('#')) {
                var parts = pageId.split('#');
                pageId = parts[0];
                anchor = parts[1];
            }
            pageId = decodeURIComponent(pageId);

            var home = document.getElementById('home-content');
            var pageContent = document.getElementById('page-content');
            var path = pagePathMap[pageId];

            home.style.display = 'none';
            pageContent.innerHTML = '';
            pageContent.style.display = 'block';

            if (!path) {
                render404(pageId, pageContent);
                return;
            }

            var cacheKey = 'page_' + pageId;
            sessionStorage.removeItem(cacheKey);
            sessionStorage.removeItem(cacheKey + '_time');

            isLoading = true;

            pageContent.innerHTML = '<div class="doc-content" style="text-align:center;padding:3rem 0;"><img src="favicon.png" alt="加载中" class="loading-icon" style="display:block;margin:0 auto;width:64px;height:64px;image-rendering:pixelated;animation:breathe 1.2s ease-in-out infinite;" /><p style="color:var(--text-muted);margin-top:1rem;font-size:clamp(0.9rem, 1.2vw, 1.1rem);">加载中...</p></div>';

            fetch(path)
                .then(function(response) {
                    if (!response.ok) {
                        if (response.status === 404) throw new Error('HTTP 404');
                        if (response.status === 403) throw new Error('HTTP 403');
                        throw new Error('HTTP ' + response.status);
                    }
                    return response.text();
                })
                .then(function(content) {
                    // ============================================================
                    // 判断文件类型：.md 文件用 marked 解析，.html 文件直接使用
                    // ============================================================
                    var isMarkdown = path.endsWith('.md');
                    var htmlContent = content;

                    if (isMarkdown && typeof marked !== 'undefined') {
                        try {
                            htmlContent = marked.parse(content);
                        } catch (e) {
                            console.warn('[刺玫会 Wiki] Markdown 解析失败，降级为纯文本:', e);
                            htmlContent = '<pre style="white-space:pre-wrap;color:var(--text-secondary);">' + content + '</pre>';
                        }
                    }

                    // 如果文件是 .html 或者解析失败，直接使用原内容
                    pageContent.innerHTML = htmlContent;

                    // 渲染图标短代码（如果有）
                    if (typeof renderIcons === 'function') {
                        renderIcons(pageContent);
                    }

                    // 加载评论区
                    if (typeof loadGiscus === 'function') {
                        loadGiscus(pageId || window.location.hash.replace('#page-', ''));
                    }

                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    if (window.location.hash !== '#page-' + pageId) {
                        history.pushState(null, '', '#page-' + pageId);
                    }
                    if (typeof updateActiveState === 'function') {
                        updateActiveState(pageId);
                    }
                    reExecuteScripts(pageContent);
                    if (pageId === '论坛') {
                        setTimeout(function() { loadGiscus(); }, 300);
                    }
                    if (anchor) {
                        setTimeout(function() {
                            var target = document.getElementById(anchor);
                            if (target) target.scrollIntoView({ behavior: 'smooth' });
                        }, 150);
                    }
                })
                .catch(function(error) {
                    var message = '加载失败，请检查网络连接后重试。';
                    var detail = '';
                    if (error.message === 'HTTP 404') {
                        message = '该页面内容不存在，可能已被移除或尚未创建。';
                        detail = '请检查链接是否正确，或联系管理员确认页面状态。';
                    } else if (error.message === 'HTTP 403') {
                        message = '您没有权限访问此页面。';
                        detail = '该页面可能需要特定权限才能查看。';
                    } else if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                        message = '网络连接异常，无法访问该页面。';
                        detail = '请检查您的网络连接后重试。';
                    } else {
                        detail = '错误详情：' + error.message;
                    }

                    pageContent.innerHTML = '<div class="doc-content">' +
                        '<h1 style="border-left-color:#c0392b;">加载失败</h1>' +
                        '<p style="color:var(--text-secondary);font-size:1.1rem;">' + message + '</p>' +
                        (detail ? '<p style="color:var(--text-muted);font-size:0.9rem;">' + detail + '</p>' : '') +
                        '<div style="display:flex;flex-wrap:wrap;gap:0.8rem;margin:1.2rem 0;">' +
                        '<a href="/wiki/" style="padding:0.5rem 1.2rem;border-radius:40px;background:var(--accent);color:#fff;font-family:var(--font-pixel);font-size:0.9rem;transition:all var(--transition);display:inline-block;">返回首页</a>' +
                        '<a href="https://github.com/SoServer/SoServer.github.io" target="_blank" style="padding:0.5rem 1.2rem;border-radius:40px;border:1px solid var(--border-color);color:var(--text-secondary);font-family:var(--font-pixel);font-size:0.9rem;transition:all var(--transition);display:inline-block;">反馈问题</a>' +
                        '</div>' +
                        '<div class="footnote"><p>刺玫会 · ' + (error.message === 'HTTP 404' ? '404' : '加载错误') + '</p></div>' +
                        '</div>';
                    if (typeof renderIcons === 'function') {
                        renderIcons(pageContent);
                    }
                })
                .finally(function() {
                    isLoading = false;
                });
        }

        function clearCacheAndReload() {
            sessionStorage.clear();
            localStorage.setItem('app_version', APP_VERSION);
            location.reload();
        }
        window.clearCacheAndReload = clearCacheAndReload;

        function showHome() {
            var home = document.getElementById('home-content');
            var pageContent = document.getElementById('page-content');
            home.style.display = 'block';
            pageContent.style.display = 'none';
            pageContent.innerHTML = '';
            history.pushState(null, '', '/wiki/');
            document.querySelectorAll('.sub-menu a, .card-list li').forEach(function(el) {
                el.classList.remove('active');
            });
        }
        window.loadPage = loadPage;
        window.showHome = showHome;

        function openLoginModal(e) {
            if (e) e.preventDefault();
            document.getElementById('loginModal').classList.add('active');
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginError').classList.remove('show');
            setTimeout(function() {
                document.getElementById('loginUsername').focus();
            }, 100);
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('active');
        }

        function login() {
            var username = document.getElementById('loginUsername').value.trim();
            var errorEl = document.getElementById('loginError');
            if (!username) {
                errorEl.textContent = '请输入用户名';
                errorEl.classList.add('show');
                return;
            }
            if (username.length < 2) {
                errorEl.textContent = '用户名至少2个字符';
                errorEl.classList.add('show');
                return;
            }
            localStorage.setItem('token', 'mock-token');
            localStorage.setItem('username', username);
            closeLoginModal();
            updateAuthUI();
        }

        function logout(e) {
            if (e) e.preventDefault();
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            updateAuthUI();
        }

        function updateAuthUI() {
            var token = localStorage.getItem('token');
            var username = localStorage.getItem('username');
            var loginBtn = document.getElementById('loginBtn');
            var logoutBtn = document.getElementById('logoutBtn');
            var userDisplay = document.getElementById('userDisplay');
            var usernameDisplay = document.getElementById('usernameDisplay');
            var sidebarUser = document.getElementById('sidebarUser');
            var sidebarUsername = document.getElementById('sidebarUsername');
            var sidebarLoginBtn = document.getElementById('sidebarLoginBtn');
            var sidebarLogoutBtn = document.getElementById('sidebarLogoutBtn');

            if (token && username) {
                if (loginBtn) loginBtn.style.display = 'none';
                if (logoutBtn) logoutBtn.style.display = 'inline-flex';
                if (userDisplay) userDisplay.style.display = 'inline-block';
                if (usernameDisplay) usernameDisplay.textContent = username;
                if (sidebarUser) sidebarUser.style.display = 'flex';
                if (sidebarUsername) sidebarUsername.textContent = username;
                if (sidebarLoginBtn) sidebarLoginBtn.style.display = 'none';
                if (sidebarLogoutBtn) sidebarLogoutBtn.style.display = 'inline';
            } else {
                if (loginBtn) loginBtn.style.display = 'inline-flex';
                if (logoutBtn) logoutBtn.style.display = 'none';
                if (userDisplay) userDisplay.style.display = 'none';
                if (sidebarUser) sidebarUser.style.display = 'none';
                if (sidebarLoginBtn) sidebarLoginBtn.style.display = 'inline';
                if (sidebarLogoutBtn) sidebarLogoutBtn.style.display = 'none';
            }
        }

        function initRoomStatus() {
            var banner = document.getElementById('roomBanner');
            var display = document.getElementById('roomNumberDisplay');
            if (!banner || !display) return;
            fetch('room_number.txt?' + Date.now())
                .then(function(response) {
                    if (!response.ok) throw new Error('文件不存在');
                    return response.text();
                })
                .then(function(text) {
                    var match = text.match(/setroomnumber:"([^"]+)"/);
                    if (match && match[1]) {
                        display.textContent = match[1];
                        banner.classList.add('show');
                    } else {
                        banner.classList.remove('show');
                        console.log('[刺玫会 Wiki] room_number.txt 格式错误，未找到有效房间号');
                    }
                })
                .catch(function() {
                    banner.classList.remove('show');
                    console.log('[刺玫会 Wiki] room_number.txt 未找到，房间号横幅已隐藏');
                });
        }

        function resetScrollPosition() {
            window.scrollTo(0, 0);
        }

        window.addEventListener('hashchange', function() {
            var hash = window.location.hash;
            if (hash && hash.startsWith('#page-')) {
                var pageId = decodeURIComponent(hash.replace('#page-', ''));
                console.log('[hashchange] 触发加载:', pageId);
                if (typeof loadPage === 'function') {
                    loadPage(pageId);
                } else {
                    console.error('[hashchange] loadPage 未定义');
                }
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            if ('scrollRestoration' in history) {
                history.scrollRestoration = 'manual';
            }
            loadVersion();
            resetScrollPosition();
            document.body.classList.add('loaded');
            renderCards();
            initCards();
            initRoomStatus();
            updateAuthUI();

            if (typeof initSearch === 'function') {
                initSearch();
            }

            var sidebarHeader = document.getElementById('sidebarHeader');
            if (sidebarHeader) {
                sidebarHeader.addEventListener('click', function() {
                    if (typeof window.showHome === 'function') {
                        window.showHome();
                    } else {
                        window.location.href = '/wiki/';
                    }
                    if (typeof closeSidebarIfMobile === 'function') {
                        closeSidebarIfMobile();
                    }
                });
            }

            document.getElementById('loginUsername').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') login();
            });
            document.getElementById('loginModal').addEventListener('click', function(e) {
                if (e.target === this) closeLoginModal();
            });

            setTimeout(resetScrollPosition, 50);
            setTimeout(resetScrollPosition, 200);
        });

        function initHash() {
            var hash = window.location.hash;
            if (hash && hash.startsWith('#page-')) {
                var pageId = decodeURIComponent(hash.replace('#page-', ''));
                setTimeout(function() {
                    if (typeof loadPage === 'function') {
                        loadPage(pageId);
                    }
                }, 100);
            }
        }
        initHash();
    </script>
</body>
</html>
